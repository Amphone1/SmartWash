name: ci
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: smartwash
          POSTGRES_USER: smartwash
          POSTGRES_PASSWORD: change_me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartwash"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint
        run: npx nx run-many -t lint
      - name: Migrate (apply schema)
        run: npx nx run db:migrate
        env: { DATABASE_URL: postgresql://smartwash:change_me@localhost:5432/smartwash }
      - name: Verify ledger DB invariants (A1 double-entry)
        run: psql -v ON_ERROR_STOP=1 -f infra/db/init/tests/07_double_entry_ledger.verify.sql "$DATABASE_URL"
        env: { DATABASE_URL: postgresql://smartwash:change_me@localhost:5432/smartwash }
      - name: Verify accounts chart (A2)
        run: psql -v ON_ERROR_STOP=1 -f infra/db/init/tests/09_accounts_chart.verify.sql "$DATABASE_URL"
        env: { DATABASE_URL: postgresql://smartwash:change_me@localhost:5432/smartwash }
      - name: Unit + integration tests
        run: npx nx run-many -t test
        env:
          DATABASE_URL: postgresql://smartwash:change_me@localhost:5432/smartwash
          REDIS_URL: redis://localhost:6379
      - name: Validate OpenAPI + event schemas
        run: npx nx run contracts:validate

  # FastAPI services (ocr, risk) use a Python toolchain separate from Nx.
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [ocr, risk] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install + test
        working-directory: services/${{ matrix.service }}
        run: |
          pip install ".[dev]"
          python -m pytest -q

  build:
    needs: [build-test, python-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build affected services (esbuild bundles)
        run: npx nx affected -t build --base=HEAD~1 --head=HEAD

  # ── Phase 6: build + push images, then deploy to k3s ──────────────────
  images:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service:
          - auth
          - rbac
          - order
          - queue
          - bff
          - ledger
          - wallet
          - payment
          - fraud
          - machine
          - delivery
          - gps
          - settlement
          - reconciliation
          - saga
          - notification
          - audit
          - device-sim
          - ocr
          - risk
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest

  deploy:
    needs: images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production # requires KUBE_CONFIG secret + approval
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Apply config + run migration Job
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/config.yaml
          # secrets are applied out-of-band (vault / sealed-secrets), not here
          # kubectl -n smartwash create job --from=cronjob/... db-migrate-$GITHUB_SHA ...
      - name: Roll out services
        run: |
          for svc in auth rbac order queue bff ledger wallet payment fraud \
                     machine delivery gps settlement reconciliation saga \
                     notification audit; do
            kubectl -n smartwash set image deploy/$svc \
              $svc=ghcr.io/${{ github.repository }}/$svc:${{ github.sha }} || true
          done
          kubectl -n smartwash rollout status deploy/bff --timeout=120s
