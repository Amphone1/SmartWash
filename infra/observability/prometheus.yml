# Prometheus dev scrape config. Services expose /metrics (rule #7); add a
# scrape job per service as it comes online in later phases.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Phase 0 has no services yet. As each NestJS/FastAPI service is added,
  # append a job here, e.g.:
  # - job_name: ledger
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['ledger:3000']
