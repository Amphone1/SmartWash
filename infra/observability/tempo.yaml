# Tempo single-binary dev config. Receives OTLP/HTTP on :4318 (see
# OTEL_EXPORTER_OTLP_ENDPOINT in infra/.env.example) and stores traces locally.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
