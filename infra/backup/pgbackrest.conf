[global]
# Repository (e.g. S3/MinIO bucket) + retention. Credentials via env/secret.
repo1-type=s3
repo1-path=/pgbackrest/smartwash
repo1-retention-full=7
repo1-retention-diff=14
start-fast=y
compress-type=zst
# Encrypt backups at rest (key from secret).
repo1-cipher-type=aes-256-cbc

[smartwash]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=smartwash
