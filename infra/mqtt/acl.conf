%%--------------------------------------------------------------------
%% SmartWash EMQX authorization (file source). Enforce in PROD alongside
%% per-role authentication. Dev runs anonymous (see infra/mqtt/README.md),
%% so this file is mounted but not enforced until authn is configured.
%%
%% Topic plan: smartwash/{branch}/{machine}/{cmd|status|lwt}
%%--------------------------------------------------------------------

%% Backend (the Machine service): drive commands, observe status + last-will.
{allow, {user, "backend"}, publish,   ["smartwash/+/+/cmd"]}.
{allow, {user, "backend"}, subscribe, ["smartwash/+/+/status", "smartwash/+/+/lwt"]}.

%% Devices (WISE-4051): publish their own telemetry, receive their own commands.
%% PROD hardening: issue per-device credentials and scope with the ${username}
%% / ${clientid} placeholder so a device can only touch its own machine, e.g.
%%   {allow, {user, "dev-${clientid}"}, publish, ["smartwash/+/${clientid}/status"]}.
{allow, {user, "device"}, publish,   ["smartwash/+/+/status", "smartwash/+/+/lwt"]}.
{allow, {user, "device"}, subscribe, ["smartwash/+/+/cmd"]}.

%% Default deny — nothing else is permitted.
{deny, all}.
