# Traefik dynamic config (file provider). Only the public edges are routed here:
# the BFF (customer app aggregator) and Auth (token endpoints). Order, Queue,
# RBAC and all money/finance services are intentionally NOT exposed — internal
# only on the compose network, reachable solely by the BFF with the internal token.
#
# NOTE (Traefik v3): a router with `tls` only serves TLS traffic — so each edge
# needs a plain-HTTP router (dev) AND a TLS router (websecure) separately.
http:
  middlewares:
    strip-api:
      stripPrefix:
        prefixes: ["/api"]
    # Coarse per-client-IP rate limit (defense in depth; the BFF also enforces
    # fine per-user limits via the nestkit RateLimitGuard).
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
    # DEV ONLY: let the Vite portals (5173/5174) and Expo web (8082/19006) call
    # the gateway from the browser. Prod serves the portals from the same origin
    # (or pins exact origins) — never ship localhost origins.
    dev-cors:
      headers:
        accessControlAllowMethods: ["GET", "POST", "DELETE", "OPTIONS"]
        accessControlAllowHeaders:
          ["authorization", "content-type", "idempotency-key"]
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "http://localhost:5174"
          - "http://localhost:8082"
          - "http://localhost:8083"
          - "http://localhost:8084"
          - "http://localhost:19006"
        accessControlMaxAge: 600
        addVaryHeader: true

  routers:
    bff-web:
      rule: "PathPrefix(`/api/bff`)"
      entryPoints: ["web"]
      middlewares: ["dev-cors", "rate-limit", "strip-api"]
      service: bff
    bff-secure:
      rule: "PathPrefix(`/api/bff`)"
      entryPoints: ["websecure"]
      middlewares: ["rate-limit", "strip-api"]
      service: bff
      tls: {} # dev: Traefik self-signed; prod: set a certResolver (ACME)
    auth-web:
      rule: "PathPrefix(`/api/auth`)"
      entryPoints: ["web"]
      middlewares: ["dev-cors", "rate-limit", "strip-api"]
      service: auth
    auth-secure:
      rule: "PathPrefix(`/api/auth`)"
      entryPoints: ["websecure"]
      middlewares: ["rate-limit", "strip-api"]
      service: auth
      tls: {}

  services:
    bff:
      loadBalancer:
        servers:
          - url: "http://bff:3005"
    auth:
      loadBalancer:
        servers:
          - url: "http://auth:3001"
