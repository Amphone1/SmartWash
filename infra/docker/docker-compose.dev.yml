# SmartWash — local dev stack. `docker compose up -d`
# Brings up infra dependencies + the Phase 1 services behind Traefik.

# Shared env for the NestJS services. Override secrets via a real .env in prod.
x-service-env: &service-env
  NODE_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgresql://smartwash:change_me@postgres:5432/smartwash
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  INTERNAL_SERVICE_TOKEN: change_me_internal

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_started

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: smartwash
      POSTGRES_USER: smartwash
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d   # 01_schema.sql auto-loads on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwash"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  emqx:
    image: emqx/emqx:5
    ports: ["1883:1883", "18083:18083"]   # mqtt + dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: change_me

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change_me
      MINIO_ROOT_PASSWORD: change_me
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: change_me
    ports: ["8080:8080"]

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: smartwash
      POSTGRES_PWD: change_me
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on: [postgres]

  # ── Observability ──────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["../observability/prometheus.yml:/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: change_me

  loki:
    image: grafana/loki:latest
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["4318:4318"]   # OTLP http
    volumes:
      - "../observability/tempo.yaml:/etc/tempo.yaml"
      - tempodata:/var/tempo

  alertmanager:
    image: prom/alertmanager:latest
    ports: ["9093:9093"]

  # ── Gateway ────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "8088:80"     # public API gateway  → http://localhost:8088/api/...
      - "8081:8080"   # Traefik dashboard
    volumes:
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on: [bff, auth]

  # ── Phase 1 services ───────────────────────────────
  auth:
    build: { context: ../.., dockerfile: services/auth/Dockerfile }
    environment:
      <<: *service-env
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: smartwash
    depends_on: *service-depends

  rbac:
    build: { context: ../.., dockerfile: services/rbac/Dockerfile }
    environment: { <<: *service-env }
    depends_on: *service-depends

  order:
    build: { context: ../.., dockerfile: services/order/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: order
      OUTBOX_AGGREGATE_TYPES: order
      VAT_BPS: "0"
    depends_on:
      <<: *service-depends
      nats: { condition: service_started }

  queue:
    build: { context: ../.., dockerfile: services/queue/Dockerfile }
    environment:
      <<: *service-env
      QUEUE_HOLD_SECONDS: "300"
    depends_on: *service-depends

  bff:
    build: { context: ../.., dockerfile: services/bff/Dockerfile }
    environment:
      <<: *service-env
      AUTH_URL: http://auth:3001
      RBAC_URL: http://rbac:3002
      ORDER_URL: http://order:3003
      QUEUE_URL: http://queue:3004
    depends_on:
      <<: *service-depends
      auth:
        condition: service_started
      rbac:
        condition: service_started
      order:
        condition: service_started
      queue:
        condition: service_started

  # ── Phase 2 services (financial spine) ─────────────
  ledger:
    build: { context: ../.., dockerfile: services/ledger/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: ledger
      OUTBOX_AGGREGATE_TYPES: ledger
    depends_on:
      <<: *service-depends
      nats: { condition: service_started }

  wallet:
    build: { context: ../.., dockerfile: services/wallet/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: wallet
    depends_on:
      <<: *service-depends
      nats: { condition: service_started }

  payment:
    build: { context: ../.., dockerfile: services/payment/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: payment
      OUTBOX_AGGREGATE_TYPES: payment
      PAYMENT_EXPIRY_MIN: "30"
    depends_on:
      <<: *service-depends
      nats: { condition: service_started }

  fraud:
    build: { context: ../.., dockerfile: services/fraud/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: fraud
    depends_on: *service-depends

  ocr:
    build: { context: ../.., dockerfile: services/ocr/Dockerfile }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

  risk:
    build: { context: ../.., dockerfile: services/risk/Dockerfile }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

  saga:
    build: { context: ../.., dockerfile: services/saga/Dockerfile }
    environment:
      <<: *service-env
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      OWNER_ACCOUNT: OWNER-ACC-0001
      OCR_URL: http://ocr:8001
      RISK_URL: http://risk:8002
      FRAUD_URL: http://fraud:3008
      PAYMENT_URL: http://payment:3009
      LEDGER_URL: http://ledger:3007
    depends_on:
      <<: *service-depends
      nats: { condition: service_started }
      temporal: { condition: service_started }

  # ── Phase 3 services (Machine + IoT) ───────────────
  machine:
    build: { context: ../.., dockerfile: services/machine/Dockerfile }
    environment:
      <<: *service-env
      SERVICE_NAME: machine
      OUTBOX_AGGREGATE_TYPES: machine
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: backend
      HEARTBEAT_TIMEOUT_SEC: "30"
    depends_on:
      <<: *service-depends
      nats: { condition: service_started }
      emqx: { condition: service_started }

  device-sim:
    build: { context: ../.., dockerfile: services/device-sim/Dockerfile }
    environment:
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: device
      # Configure machines to emulate (must match DB rows), e.g.:
      # SIM_DEVICES: '[{"machineId":"<uuid>","branchId":"<uuid>","code":"W001"}]'
      SIM_DEVICES: "[]"
      SIM_STEP_MS: "2000"
    depends_on:
      emqx: { condition: service_started }

volumes:
  pgdata:
  miniodata:
  tempodata:
