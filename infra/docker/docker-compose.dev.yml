# SmartWash — local dev stack. `docker compose up -d`
# Brings up infra dependencies + the Phase 1 services behind Traefik.

# Shared env for the NestJS services. Override secrets via a real .env in prod.
x-service-env: &service-env
  NODE_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgresql://smartwash:change_me@postgres:5432/smartwash
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  INTERNAL_SERVICE_TOKEN: change_me_internal

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_started

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: smartwash
      POSTGRES_USER: smartwash
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d   # 01_schema.sql auto-loads on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwash"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  emqx:
    image: emqx/emqx:5
    ports: ["1883:1883", "18083:18083"]   # mqtt + dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: change_me

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change_me
      MINIO_ROOT_PASSWORD: change_me
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: change_me
    ports: ["8080:8080"]

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: smartwash
      POSTGRES_PWD: change_me
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on: [postgres]

  # ── Observability ──────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["../observability/prometheus.yml:/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: change_me

  loki:
    image: grafana/loki:latest
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["4318:4318"]   # OTLP http
    volumes:
      - "../observability/tempo.yaml:/etc/tempo.yaml"
      - tempodata:/var/tempo

  alertmanager:
    image: prom/alertmanager:latest
    ports: ["9093:9093"]

  # ── Gateway ────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "8088:80"     # public API gateway  → http://localhost:8088/api/...
      - "8081:8080"   # Traefik dashboard
    volumes:
      - ../traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on: [bff, auth]

  # ── Phase 1 services ───────────────────────────────
  auth:
    build: { context: ../.., dockerfile: services/auth/Dockerfile }
    environment:
      <<: *service-env
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: smartwash
    depends_on: *service-depends

  rbac:
    build: { context: ../.., dockerfile: services/rbac/Dockerfile }
    environment: { <<: *service-env }
    depends_on: *service-depends

  order:
    build: { context: ../.., dockerfile: services/order/Dockerfile }
    environment:
      <<: *service-env
      VAT_BPS: "0"
    depends_on: *service-depends

  queue:
    build: { context: ../.., dockerfile: services/queue/Dockerfile }
    environment:
      <<: *service-env
      QUEUE_HOLD_SECONDS: "300"
    depends_on: *service-depends

  bff:
    build: { context: ../.., dockerfile: services/bff/Dockerfile }
    environment:
      <<: *service-env
      AUTH_URL: http://auth:3001
      RBAC_URL: http://rbac:3002
      ORDER_URL: http://order:3003
      QUEUE_URL: http://queue:3004
    depends_on:
      <<: *service-depends
      auth:
        condition: service_started
      rbac:
        condition: service_started
      order:
        condition: service_started
      queue:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  tempodata:
